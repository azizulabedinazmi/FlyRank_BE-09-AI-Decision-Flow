<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" aria-labelledby="t d" role="img" viewBox="0 0 1280 640"><title id="t">AI Decision Flow: a visual workflow of YES/NO AI steps, run by Inngest</title><desc id="d">Animated run of the example flow: an incoming message asking about price and a demo enters at Start, the &quot;Support request?&quot; step answers NO, the &quot;Buying intent?&quot; step answers YES, and the run ends at the Sales outcome, while an execution log lists each Inngest step in order. By Azizul Abedin Azmi, FlyRank verified.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#FFF" stroke-opacity=".035" d="M40 0H0V40"/></pattern><radialGradient id="g1" cx="85%" cy="15%" r="45%"><stop offset="0" stop-color="#2ECC80" stop-opacity=".18"/><stop offset="1" stop-color="#2ECC80" stop-opacity="0"/></radialGradient><radialGradient id="g2" cx="10%" cy="95%" r="50%"><stop offset="0" stop-color="#1A7A4A" stop-opacity=".35"/><stop offset="1" stop-color="#1A7A4A" stop-opacity="0"/></radialGradient><style>@keyframes e0{0%,11%,97%{stroke-dashoffset:1}16%,92%{stroke-dashoffset:0}}@keyframes e2{0%,29%,97%{stroke-dashoffset:1}34%,92%{stroke-dashoffset:0}}@keyframes l2{0%,29%,97%{opacity:0}31%,92%{opacity:1}}@keyframes e5{0%,49%,97%{stroke-dashoffset:1}54%,92%{stroke-dashoffset:0}}@keyframes l5{0%,49%,97%{opacity:0}51%,92%{opacity:1}}@keyframes n_start{0%,6%,97%{stroke:#2b4a44}7%{stroke:#f2c66d}13%,92%{stroke:#94a3b8}}@keyframes n_support{0%,17%,97%{stroke:#2b4a44}18%{stroke:#f2c66d}24%,92%{stroke:#fb7185}}@keyframes n_buying{0%,37%,97%{stroke:#2b4a44}38%{stroke:#f2c66d}44%,92%{stroke:#34d399}}@keyframes n_sales{0%,56%,97%{stroke:#2b4a44}57%{stroke:#f2c66d}63%,92%{stroke:#34d399}}@keyframes log0{0%,7%,97%{opacity:0}9%,92%{opacity:1}}@keyframes log1{0%,24%,97%{opacity:0}26%,92%{opacity:1}}@keyframes log2{0%,44%,97%{opacity:0}46%,92%{opacity:1}}@keyframes log3{0%,58%,97%{opacity:0}60%,92%{opacity:1}}text{font-family:&quot;Segoe UI&quot;,-apple-system,Roboto,Helvetica,Arial,sans-serif}.eyebrow{font-size:17px;letter-spacing:3px;font-weight:600;fill:#6fdca4}.h1{font-size:84px;font-weight:800;fill:#fff;letter-spacing:-2px}.sub{font-size:25px;fill:#b9d3c8}.chip{font-family:Consolas,Menlo,monospace;font-size:16px;font-weight:700;fill:#6fdca4}.name{font-size:22px;font-weight:600;fill:#fff}.mono{font-family:Consolas,Menlo,monospace}.e0{animation:e0 12s linear infinite}.e2{animation:e2 12s linear infinite}.l2{animation:l2 12s linear infinite}.e5{animation:e5 12s linear infinite}.l5{animation:l5 12s linear infinite}.n_start{animation:n_start 12s linear infinite}.n_support{animation:n_support 12s linear infinite}.n_buying{animation:n_buying 12s linear infinite}.n_sales{animation:n_sales 12s linear infinite}.log0{animation:log0 12s linear infinite}.log1{animation:log1 12s linear infinite}.log2{animation:log2 12s linear infinite}.log3{animation:log3 12s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.e0,.e2{stroke-dashoffset:0}.l2{opacity:1}.e5{stroke-dashoffset:0}.l5{opacity:1}.n_start{stroke:#94a3b8}.n_support{stroke:#fb7185}.n_buying,.n_sales{stroke:#34d399}.log0,.log1,.log2,.log3{opacity:1}}</style></defs><rect width="1280" height="640" fill="#051F21"/><rect width="1280" height="640" fill="url(#g2)"/><rect width="1280" height="640" fill="url(#g1)"/><rect width="1280" height="640" fill="url(#grid)"/><text x="72" y="98" class="eyebrow">FLYRANK AI INTERNSHIP · BE-09 · WEEK 7</text><text x="66" y="190" class="h1">AI Decision</text><text x="66" y="276" class="h1">Flow</text><text x="72" y="334" class="sub">Every node asks the model one question.</text><text x="72" y="368" class="sub">YES or NO picks the next edge.</text><rect width="120" height="34" x="73" y="404" fill="none" stroke="#6FDCA4" stroke-width="2" rx="8"/><text x="133" y="427" class="chip" text-anchor="middle">React Flow</text><rect width="89.4" height="34" x="205" y="404" fil